Section "ServerLayout"
    Identifier "rx1950"
    Screen 0 "LCD"
EndSection

# musl resolves driver relocations eagerly.  Load the modules that provide
# fbdev_drv.so's fbdevHW* and shadow* symbols before loading the video driver.
Section "Module"
    Load "fb"
    Load "shadow"
    Load "fbdevhw"
EndSection

Section "Device"
    Identifier "S3C framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "240x320 LCD"
EndSection

Section "Screen"
    Identifier "LCD"
    Device "S3C framebuffer"
    Monitor "240x320 LCD"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
        Modes "240x320"
    EndSubSection
EndSection

Section "InputClass"
    Identifier "RX1950 touchscreen"
    MatchProduct "S3C24XX TouchScreen"
    Driver "evdev"
EndSection

Section "InputClass"
    Identifier "RX1950 buttons"
    MatchProduct "gpio-keys"
    Driver "evdev"
EndSection
