Section "ServerLayout"
    Identifier "rx1950"
    Screen 0 "LCD"
    # The RX1950 has fixed kernel input registration: touchscreen is event0
    # and GPIO buttons are event2. Make them explicit core devices; no
    # userspace device manager is needed for this fixed hardware.
    InputDevice "RX1950 touchscreen" "CorePointer"
    InputDevice "RX1950 buttons" "CoreKeyboard"
EndSection

Section "ServerFlags"
    # Avoid duplicate hot-plug input devices and the corresponding boot race.
    Option "AutoAddDevices" "false"
EndSection

# musl resolves driver relocations eagerly.  Load the modules that provide
# fbdev_drv.so's fbdevHW* and shadow* symbols before loading the video driver.
Section "Module"
    Load "fb"
    Load "shadow"
    Load "fbdevhw"
EndSection

Section "Device"
    Identifier "S3C framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "240x320 LCD"
EndSection

Section "Screen"
    Identifier "LCD"
    Device "S3C framebuffer"
    Monitor "240x320 LCD"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
        Modes "240x320"
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "RX1950 touchscreen"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
    Option "SendCoreEvents" "true"
    # Least-squares affine fit of the five measured points (four corners plus
    # centre). It corrects both reversed axes, the small skew and translation;
    # raw S3C ADC coordinates cover 0..1023 on each axis.
    Option "TransformationMatrix" "-1.285855985 0.008767978 1.134934000 0.002143120 -1.318328347 1.152815066 0 0 1"
EndSection

Section "InputDevice"
    Identifier "RX1950 buttons"
    Driver "evdev"
    Option "Device" "/dev/input/event2"
    Option "SendCoreEvents" "true"
EndSection
