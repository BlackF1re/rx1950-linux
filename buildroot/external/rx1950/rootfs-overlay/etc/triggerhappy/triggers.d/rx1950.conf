# Application keys only. D-pad and Enter remain ordinary GUI navigation.
KEY_POWER 1 /usr/bin/rx1950-launch --name power /usr/bin/mb-applet-xterm-wrapper.sh -e /usr/sbin/rx1950-power-menu
KEY_F1 1 /usr/bin/rx1950-launch --name calculator /usr/bin/xcalc
KEY_F2 1 /usr/bin/rx1950-launch --name editor /usr/bin/xedit
KEY_F3 1 /usr/bin/rx1950-launch --name terminal /usr/bin/mb-applet-xterm-wrapper.sh
KEY_F4 1 /usr/bin/rx1950-wifi-launcher
KEY_F5 1 /usr/bin/rx1950-keyboard toggle
