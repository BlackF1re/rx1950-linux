# Default application keys. D-pad and Enter remain ordinary GUI navigation.
# These are user-editable at runtime from Settings > Buttons.
KEY_POWER 1 /usr/bin/rx1950-launch --name settings /usr/bin/rx1950-settings power
KEY_F1 1 /usr/bin/rx1950-launch --name files /usr/bin/pcmanfm /root
KEY_F2 1 /usr/bin/rx1950-launch --name editor /usr/bin/leafpad
KEY_F3 1 /usr/bin/rx1950-launch --name terminal /usr/bin/mb-applet-xterm-wrapper.sh
KEY_F4 1 /usr/bin/rx1950-launch --name settings /usr/bin/rx1950-settings wifi
KEY_F5 1 /usr/bin/rx1950-keyboard toggle
