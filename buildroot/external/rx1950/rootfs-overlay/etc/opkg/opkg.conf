# rx1950-linux package manager configuration.
#
# Repository definitions live in /etc/opkg/*.conf and are deliberately kept
# separate from the core destination/architecture policy.  Packages must match
# the ABI epoch below: ARM920T/ARMv4T, EABI, soft-float, musl.

arch all 1
arch rx1950_armv4t_musl_v1 100

dest root /
option lists_dir /var/lib/opkg/lists
option tmp_dir /tmp
