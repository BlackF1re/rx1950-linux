# rx1950-linux engineering package-manager configuration.
#
# A remote source is deliberately not configured here.  Packages for this
# ARM920T/ARMv4T musl userspace must come from the project feed built for the
# exact release ABI; pointing opkg at an unrelated OpenWrt/Entware feed is not
# safe.  Release builds may add a signed src/gz entry once that feed exists.

dest root /
lists_dir ext /var/lib/opkg/lists
option tmp_dir /tmp
