# rx1950-linux package manager configuration.
#
# Packages come only from the project feed built with the same ARM920T/ARMv4T,
# EABI, soft-float and musl toolchain as the system image.  The architecture
# token contains an ABI epoch so a future incompatible userspace can move to a
# new token without allowing old systems to install incompatible packages.

src/gz rx1950 https://github.com/BlackF1re/rx1950-linux/releases/latest/download

arch all 1
arch rx1950_armv4t_musl_v1 100

dest root /
lists_dir ext /var/lib/opkg/lists
option tmp_dir /tmp
