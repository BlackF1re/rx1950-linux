name: Build rx1950-linux

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build SD image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget cpio rsync bc python3

      - name: Prepare build workspace
        run: |
          mkdir -p output
          echo "rx1950-linux build pipeline initialized" > output/build-info.txt

      - name: Create placeholder SD image
        run: |
          truncate -s 128M output/rx1950-linux.img

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: rx1950-linux-sd-image
          path: output/rx1950-linux.img
