name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build rx1950 Linux image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio rsync unzip wget file parted dosfstools e2fsprogs

      - name: Prepare build environment
        run: |
          ./scripts/build.sh

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx1950-linux-image
          path: output/*.img
