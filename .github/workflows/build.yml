name: Build rx1950-linux image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SD card image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential cpio file flex bison git rsync unzip wget \
            dosfstools e2fsprogs parted qemu-user-static

      - name: Build image
        run: ./scripts/build.sh

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rx1950-linux-sd-image
          path: output/*.img
          retention-days: 30
