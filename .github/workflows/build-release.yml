name: Build & Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish build artifact
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'board/**'
      - 'buildroot/**'
      - 'kernel/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: rx1950-linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan build
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          echo "build_id=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

  rootfs:
    name: Build root filesystem
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio rsync unzip wget file
      - name: Build rootfs
        run: ./scripts/build.sh rootfs
      - name: Upload rootfs handoff
        uses: actions/upload-artifact@v4
        with:
          name: rx1950-rootfs-${{ needs.plan.outputs.build_id }}
          path: output/rootfs.tar.zst

  kernel:
    name: Build Linux kernel
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev
      - name: Build kernel
        run: ./scripts/build.sh kernel
      - name: Upload kernel handoff
        uses: actions/upload-artifact@v4
        with:
          name: rx1950-kernel-${{ needs.plan.outputs.build_id }}
          path: output/kernel.tar.zst

  assemble:
    name: Assemble SD image
    needs: [plan, rootfs, kernel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools e2fsprogs parted
      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          pattern: rx1950-rootfs-*
          merge-multiple: true
      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          pattern: rx1950-kernel-*
          merge-multiple: true
      - name: Create SD image
        run: ./scripts/build.sh image
      - name: Upload Rufus image
        uses: actions/upload-artifact@v4
        with:
          name: rx1950-linux-sd-image-${{ needs.plan.outputs.build_id }}
          path: output/*.img
