name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'board/**'
      - 'buildroot/**'
      - 'kernel/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'board/**'
      - 'buildroot/**'
      - 'kernel/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rx1950-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ID: ${{ github.sha }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.meta.outputs.id }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          echo "id=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

          latest_major=-1
          latest_minor=-1
          latest_patch=-1
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-engineer$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              if (( major > latest_major ||
                    (major == latest_major && minor > latest_minor) ||
                    (major == latest_major && minor == latest_minor && patch > latest_patch) )); then
                latest_major="$major"
                latest_minor="$minor"
                latest_patch="$patch"
              fi
            fi
          done < <(git tag --list)

          if (( latest_major < 0 )); then
            version="0.1.0-engineer"
          else
            version="${latest_major}.${latest_minor}.$((latest_patch + 1))-engineer"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Next engineering release: ${version}" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate source contract
        run: |
          bash scripts/validate.sh source
          bash scripts/validate-peripherals.sh source

  rootfs:
    name: Root filesystem
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: rx1950-buildroot-sources-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}
          restore-keys: |
            rx1950-buildroot-sources-${{ runner.os }}-
      - name: Restore exact Buildroot toolchain and package state
        uses: actions/cache@v4
        with:
          path: .build/buildroot-output
          key: rx1950-buildroot-output-v2-${{ runner.os }}-${{ hashFiles('buildroot/external/**', 'scripts/build.sh') }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex cpio file rsync curl wget unzip e2fsprogs
      - name: Build root filesystem
        run: bash scripts/build.sh rootfs
      - name: Validate root filesystem contract
        run: |
          bash scripts/validate-peripherals.sh rootfs output/buildroot.config
          bash scripts/validate-rootfs-payload.sh output/rootfs.ext2
      - name: Record root filesystem digest
        run: sha256sum output/rootfs.ext2 output/buildroot.config > output/rootfs.SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ needs.plan.outputs.id }}
          path: output/
          if-no-files-found: error

  kernel:
    name: Kernel
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: rx1950-kernel-sources-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}
          restore-keys: |
            rx1950-kernel-sources-${{ runner.os }}-
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev gcc-arm-linux-gnueabi curl git xz-utils
      - name: Build boot kernel and WLAN modules
        run: bash scripts/build.sh kernel
      - name: Validate peripheral kernel contract
        run: bash scripts/validate-peripherals.sh kernel output/kernel.config
      - name: Record kernel digest
        run: sha256sum output/zImage output/kernel.config output/kernel-modules.tar > output/kernel.SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ needs.plan.outputs.id }}
          path: |
            output/zImage
            output/kernel.config
            output/kernel-modules.tar
            output/kernel.SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble and verify
    needs: [plan, rootfs, kernel]
    runs-on: ubuntu-24.04
    env:
      RX1950_IMAGE_NAME: rx1950-linux-${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified HaRET toolchain
        uses: actions/cache@v4
        with:
          path: dl
          key: rx1950-haret-sources-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}
          restore-keys: |
            rx1950-haret-sources-${{ runner.os }}-
      - name: Install image and HaRET build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential dosfstools e2fsprogs gcc-multilib libc6-i386 lib32z1 mtools parted python3 curl xz-utils
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ needs.plan.outputs.id }}'
          path: output
          merge-multiple: true
      - name: Verify stage hand-offs
        run: sha256sum --check output/rootfs.SHA256SUMS && sha256sum --check output/kernel.SHA256SUMS
      - name: Assemble SD image
        run: bash scripts/build.sh image
      - name: Verify sealed image
        run: |
          bash scripts/validate.sh image
          bash scripts/validate-peripherals.sh image
      - uses: actions/upload-artifact@v4
        with:
          name: rx1950-linux-${{ needs.plan.outputs.id }}
          path: |
            output/rx1950-linux-${{ needs.plan.outputs.version }}.img
            output/rx1950-linux-${{ needs.plan.outputs.version }}.img.xz
            output/SHA256SUMS
            output/provenance.txt
            output/zImage
            output/kernel-modules.tar
            board/hp_rx1950/startup.txt
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [plan, assemble]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rx1950-linux-${{ needs.plan.outputs.id }}
          path: release
      - name: Publish verified payload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          image="$(find release -type f -name "rx1950-linux-${VERSION}.img.xz" -print -quit)"
          checksums="$(find release -type f -name SHA256SUMS -print -quit)"
          provenance="$(find release -type f -name provenance.txt -print -quit)"
          kernel="$(find release -type f -name zImage -print -quit)"
          modules="$(find release -type f -name kernel-modules.tar -print -quit)"
          startup="$(find release -type f -name startup.txt -print -quit)"
          test -n "$image" && test -n "$checksums" && test -n "$provenance" && test -n "$kernel" && test -n "$modules" && test -n "$startup"
          gh release create "$VERSION" "$image" "$checksums" "$provenance" "$kernel" "$modules" "$startup" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "rx1950-linux $VERSION" --generate-notes
