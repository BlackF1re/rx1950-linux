name: Build & Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish build artifact
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'board/**'
      - 'buildroot/**'
      - 'kernel/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: rx1950-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ID: ${{ github.sha }}

jobs:
  plan:
    name: Plan build
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.meta.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        run: echo "id=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

  rootfs:
    name: Build root filesystem
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc cpio rsync file curl
      - name: Build rootfs
        run: ./scripts/build.sh rootfs
      - uses: actions/upload-artifact@v4
        with:
          name: rx1950-rootfs-${{ needs.plan.outputs.id }}
          path: output/

  kernel:
    name: Build kernel
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev
      - name: Build kernel
        run: ./scripts/build.sh kernel
      - uses: actions/upload-artifact@v4
        with:
          name: rx1950-kernel-${{ needs.plan.outputs.id }}
          path: output/

  assemble:
    name: Assemble SD image
    needs: [plan, rootfs, kernel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools e2fsprogs parted
      - uses: actions/download-artifact@v4
        with:
          pattern: rx1950-*
          merge-multiple: true
      - name: Assemble image
        run: ./scripts/build.sh image
      - uses: actions/upload-artifact@v4
        with:
          name: rx1950-linux-sd-image-${{ needs.plan.outputs.id }}
          path: output/*.img
