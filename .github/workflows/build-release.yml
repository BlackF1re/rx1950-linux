name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'board/**'
      - 'buildroot/**'
      - 'kernel/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'board/**'
      - 'buildroot/**'
      - 'kernel/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rx1950-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ID: ${{ github.sha }}
  SOURCE_DATE_EPOCH: '1767225600'
  TZ: UTC
  LANG: C
  LC_ALL: C
  KBUILD_BUILD_TIMESTAMP: '@1767225600'
  KBUILD_BUILD_USER: rx1950-linux
  KBUILD_BUILD_HOST: reproducible
  KBUILD_BUILD_VERSION: '1'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.meta.outputs.id }}
      tree: ${{ steps.meta.outputs.tree }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          echo "id=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

          latest_major=-1
          latest_minor=-1
          latest_patch=-1
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-engineer$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              if (( major > latest_major ||
                    (major == latest_major && minor > latest_minor) ||
                    (major == latest_major && minor == latest_minor && patch > latest_patch) )); then
                latest_major="$major"
                latest_minor="$minor"
                latest_patch="$patch"
              fi
            fi
          done < <(git tag --list)

          if (( latest_major < 0 )); then
            version="0.1.0-engineer"
          else
            version="${latest_major}.${latest_minor}.$((latest_patch + 1))-engineer"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Next engineering release: ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source tree: $(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate source contract
        run: |
          bash scripts/validate.sh source
          bash scripts/validate-peripherals.sh source
          bash scripts/validate-opkg-feed.sh source
          bash scripts/validate-reproducible.sh source

  rootfs:
    name: Root filesystem
    needs: plan
    runs-on: ubuntu-24.04
    env:
      RX1950_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: rx1950-buildroot-sources-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}
          restore-keys: |
            rx1950-buildroot-sources-${{ runner.os }}-
      - name: Restore reusable Buildroot state
        id: rootfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/buildroot-output
          key: rx1950-buildroot-output-v5-${{ runner.os }}-2025.02.2-${{ hashFiles('buildroot/external/rx1950/configs/rx1950_defconfig', 'buildroot/external/rx1950/Config.in', 'buildroot/external/rx1950/external.mk', 'buildroot/external/rx1950/external.desc') }}
          restore-keys: |
            rx1950-buildroot-output-v5-${{ runner.os }}-2025.02.2-
            rx1950-buildroot-output-v4-${{ runner.os }}-2025.02.2-
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex cpio file rsync curl wget unzip e2fsprogs
      - name: Build root filesystem
        run: bash scripts/build.sh rootfs
      - name: Validate root filesystem contract
        run: |
          bash scripts/validate-peripherals.sh rootfs output/buildroot.config
          bash scripts/validate-rootfs-payload.sh output/rootfs.ext2
          bash scripts/validate-opkg-feed.sh rootfs output/rootfs.ext2
      - name: Record root filesystem digest
        run: sha256sum output/rootfs.ext2 output/buildroot.config > output/rootfs.SHA256SUMS
      - name: Save reusable Buildroot state
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/buildroot-output
          key: rx1950-buildroot-output-v5-${{ runner.os }}-2025.02.2-${{ hashFiles('buildroot/external/rx1950/configs/rx1950_defconfig', 'buildroot/external/rx1950/Config.in', 'buildroot/external/rx1950/external.mk', 'buildroot/external/rx1950/external.desc') }}
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ needs.plan.outputs.id }}
          path: output/
          if-no-files-found: error
          compression-level: 0

  packages:
    name: Package feed
    needs: [plan, rootfs]
    runs-on: ubuntu-24.04
    env:
      RX1950_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: rx1950-buildroot-sources-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}
          restore-keys: |
            rx1950-buildroot-sources-${{ runner.os }}-
      - name: Restore verified base Buildroot state
        uses: actions/cache/restore@v4
        with:
          path: .build/buildroot-output
          key: rx1950-buildroot-output-v5-${{ runner.os }}-2025.02.2-${{ hashFiles('buildroot/external/rx1950/configs/rx1950_defconfig', 'buildroot/external/rx1950/Config.in', 'buildroot/external/rx1950/external.mk', 'buildroot/external/rx1950/external.desc') }}
      - name: Install package-feed build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex cpio file rsync curl wget unzip e2fsprogs python3
      - name: Build package feed
        shell: bash
        run: |
          mkdir -p output
          build_log=output/package-feed-build.log
          if bash scripts/build-opkg-feed.sh >"$build_log" 2>&1; then
            echo "Package feed build completed successfully."
          else
            status=$?
            echo "Package feed build failed; showing the final 120 log lines:" >&2
            tail -n 120 "$build_log" >&2 || true
            exit "$status"
          fi
      - name: Validate package feed
        run: bash scripts/validate-opkg-feed.sh feed output/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ needs.plan.outputs.id }}
          path: output/packages/
          if-no-files-found: error
          compression-level: 0

  kernel:
    name: Kernel
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: rx1950-kernel-sources-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}
          restore-keys: |
            rx1950-kernel-sources-${{ runner.os }}-
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev gcc-arm-linux-gnueabi curl git xz-utils
      - name: Build boot kernel and WLAN modules
        run: bash scripts/build.sh kernel
      - name: Validate peripheral kernel contract
        run: bash scripts/validate-peripherals.sh kernel output/kernel.config
      - name: Record kernel digest
        run: sha256sum output/zImage output/kernel.config output/kernel-modules.tar > output/kernel.SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ needs.plan.outputs.id }}
          path: |
            output/zImage
            output/kernel.config
            output/kernel-modules.tar
            output/kernel.SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble and verify
    needs: [plan, rootfs, kernel]
    runs-on: ubuntu-24.04
    env:
      RX1950_IMAGE_NAME: rx1950-linux-${{ needs.plan.outputs.version }}
      SOURCE_TREE: ${{ needs.plan.outputs.tree }}
      RX1950_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified HaRET toolchain
        uses: actions/cache@v4
        with:
          path: dl
          key: rx1950-haret-sources-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}
          restore-keys: |
            rx1950-haret-sources-${{ runner.os }}-
      - name: Install image and HaRET build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential dosfstools e2fsprogs gcc-multilib libc6-i386 lib32z1 mtools parted python3 curl xz-utils
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ needs.plan.outputs.id }}'
          path: output
          merge-multiple: true
      - name: Verify stage hand-offs
        run: sha256sum --check output/rootfs.SHA256SUMS && sha256sum --check output/kernel.SHA256SUMS
      - name: Assemble SD image
        run: bash scripts/build.sh image
      - name: Verify sealed image
        run: |
          bash scripts/validate.sh image
          bash scripts/validate-peripherals.sh image
          bash scripts/validate-opkg-feed.sh rootfs output/rootfs.ext2
          bash scripts/validate-reproducible.sh artifacts output
      - uses: actions/upload-artifact@v4
        with:
          name: rx1950-linux-${{ needs.plan.outputs.id }}
          path: |
            output/rx1950-linux-${{ needs.plan.outputs.version }}.img
            output/rx1950-linux-${{ needs.plan.outputs.version }}.img.xz
            output/SHA256SUMS
            output/provenance.txt
            output/zImage
            output/kernel-modules.tar
            board/hp_rx1950/startup.txt
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    needs: [plan, assemble, packages]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rx1950-linux-${{ needs.plan.outputs.id }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ needs.plan.outputs.id }}
          path: release/packages
      - name: Publish verified payload and package feed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          image="$(find release -type f -name "rx1950-linux-${VERSION}.img.xz" -print -quit)"
          checksums="$(find release -type f -name SHA256SUMS -print -quit)"
          provenance="$(find release -type f -name provenance.txt -print -quit)"
          kernel="$(find release -type f -name zImage -print -quit)"
          modules="$(find release -type f -name kernel-modules.tar -print -quit)"
          startup="$(find release -type f -name startup.txt -print -quit)"
          test -n "$image" && test -n "$checksums" && test -n "$provenance" && test -n "$kernel" && test -n "$modules" && test -n "$startup"

          mapfile -t package_assets < <(find release/packages -maxdepth 1 -type f -print | LC_ALL=C sort)
          test "${#package_assets[@]}" -gt 0
          test -f release/packages/Packages.gz
          test -f release/packages/PACKAGES-SHA256SUMS

          gh release create "$VERSION" \
            "$image" "$checksums" "$provenance" "$kernel" "$modules" "$startup" \
            "${package_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "rx1950-linux $VERSION" --generate-notes
